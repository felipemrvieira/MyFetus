appId: ${APP_ID:-host.exp.exponent}

---

# E1-16.5: Smoke test da Jornada Feliz no Mobile (compatível com Expo Go e APK nativo)
# Cenário:
# 1. Login com credenciais da gestante
# 2. Onboarding gestacional com cálculo de DUM (se primeiro acesso da paciente)
# 3. Validação da tela inicial (Meu Bebê)
# 4. Navegação pelas abas principais (Água, Checklist, Exames)
# 5. Retorno à tela inicial e Logout seguro
# 6. Validação do retorno à tela de login

- launchApp:
    clearState: false

# 1. Login da Gestante
- tapOn:
    id: e2e-login-email
- eraseText
- inputText: ${PATIENT_EMAIL:-"gestante_teste@myfetus.com"}
- tapOn:
    id: e2e-login-password
- eraseText
- inputText: ${PATIENT_PASSWORD:-"SenhaTeste123!"}
- tapOn:
    id: e2e-login-submit

# 2. Onboarding / Cadastro da Gestação (executado se a gestante ainda não tiver DUM)
- runFlow:
    when:
      visible: "Já teve outras gestações?"
    commands:
      - tapOn:
          id: e2e-previous-pregnancy-no
      - tapOn:
          id: e2e-previous-pregnancy-continue
      - assertVisible: "Qual foi a data da sua última menstruação?"
      - tapOn:
          id: e2e-last-menstruation
      - inputText: "01082026"
      - tapOn:
          id: e2e-last-menstruation-submit
      - assertVisible: "Parabéns!"
      - tapOn:
          id: e2e-gestation-continue

# 3. Verificação da Home da Gestante
- assertVisible: "Meu Bebê"

# 4. Navegação pelas Abas Principais
- tapOn: "Água"
- assertVisible: "Controle de Água"

- tapOn: "Checklist"
- assertVisible: "Checklist do"

- tapOn: "Exames"
- assertVisible: "Solicitações do médico"

# 5. Retorno à Home e Logout
- tapOn: "Início"
- assertVisible: "Meu Bebê"
- tapOn:
    id: e2e-patient-sign-out

# 6. Validação de Sessão Encerrada
- assertVisible:
    id: e2e-login-submit
